name: Fix contact coverage runner once

on:
  push:
    branches:
      - feat/info-communications-contact-coverage
    paths:
      - .github/workflows/fix-contact-coverage-runner-once.yml

permissions:
  contents: write

concurrency:
  group: fix-contact-coverage-runner-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'dj-thank/queria-master' && github.ref == 'refs/heads/feat/info-communications-contact-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/info-communications-contact-coverage
          fetch-depth: 1

      - name: Switch to the compatibility runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-contact-coverage-once.yml')
          text = workflow.read_text(encoding='utf-8')

          old_command = '          python scripts/apply_contact_coverage_patch_once.py\n'
          new_command = '          python scripts/run_contact_coverage_patch_once.py\n'
          if text.count(old_command) != 1:
              raise SystemExit(f'expected one patch command, found {text.count(old_command)}')
          text = text.replace(old_command, new_command, 1)

          old_cleanup = (
              '          rm -f \\\n'
              '            .github/workflows/apply-contact-coverage-once.yml \\\n'
              '            scripts/apply_contact_coverage_patch_once.py\n'
          )
          new_cleanup = (
              '          rm -f \\\n'
              '            .github/workflows/apply-contact-coverage-once.yml \\\n'
              '            scripts/apply_contact_coverage_patch_once.py \\\n'
              '            scripts/run_contact_coverage_patch_once.py\n'
          )
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'expected one cleanup block, found {text.count(old_cleanup)}')
          workflow.write_text(text.replace(old_cleanup, new_cleanup, 1), encoding='utf-8', newline='\n')

          Path('.github/workflows/fix-contact-coverage-runner-once.yml').unlink()
          PY
          git diff --check

      - name: Commit the runner switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes required"; exit 0; }
          git commit -m "fix: use compatibility runner for contact coverage patch"
          git push origin HEAD:feat/info-communications-contact-coverage
