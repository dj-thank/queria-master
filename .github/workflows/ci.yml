name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            company_scout/public_enrichment/requirements.txt
      - name: Install test dependencies
        run: >-
          python -m pip install
          -e .
          -r company_scout/public_enrichment/requirements.txt
          pytest
      - name: Root tests
        run: python -m pytest -q
      - name: Public enrichment tests
        run: python -m pytest -q company_scout/public_enrichment/tests
      - name: Verify deterministic release manifest
        run: python scripts/generate_manifest.py --check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: company_scout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: company_scout/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build

  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - name: Select stable Rust with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Create CI-only bundled runtime placeholder
        # tauri-build validates declared resources during `cargo test`; the
        # Windows packaging workflow fetches and verifies the pinned runtime.
        run: |
          mkdir -p company_scout/src-tauri/resources/bin
          : > company_scout/src-tauri/resources/bin/codex.exe
      - name: Check formatting
        run: cargo fmt --manifest-path company_scout/src-tauri/Cargo.toml --all -- --check
      - name: Test locked dependency graph
        run: cargo test --locked --manifest-path company_scout/src-tauri/Cargo.toml
