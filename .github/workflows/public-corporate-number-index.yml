name: Build public corporate-number index

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-corporate-number-index.yml"

permissions:
  contents: read

concurrency:
  group: public-corporate-number-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Queria Master
        run: python -m pip install -e .
      - name: Build the current all-corporations database
        run: python -m queria_master refresh --scope all-corporations --no-cache
      - name: Export a minimal matching index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-index
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import duckdb

          database = Path("data/queria_master.duckdb")
          output = Path("public-index/corporate_number_index.parquet")
          con = duckdb.connect(str(database), read_only=True)
          try:
              con.execute(
                  """
                  COPY (
                      SELECT
                          corporate_number,
                          company_name,
                          company_name_kana,
                          post_code,
                          prefecture_name,
                          city_name,
                          street_number,
                          full_address,
                          nta_update_date
                      FROM core.companies
                      WHERE corporate_number IS NOT NULL
                  ) TO ? (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
                  """,
                  [str(output)],
              )
              row_count = int(con.execute("SELECT count(*) FROM core.companies").fetchone()[0])
              distinct_count = int(
                  con.execute("SELECT count(DISTINCT corporate_number) FROM core.companies").fetchone()[0]
              )
          finally:
              con.close()

          digest = hashlib.sha256()
          with output.open("rb") as handle:
              while chunk := handle.read(1024 * 1024):
                  digest.update(chunk)
          summary = {
              "source": "Queria public houjin_bangou snapshot",
              "rows": row_count,
              "distinct_corporate_numbers": distinct_count,
              "bytes": output.stat().st_size,
              "sha256": digest.hexdigest(),
          }
          Path("public-index/corporate_number_index_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-corporate-number-index
          path: public-index/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
