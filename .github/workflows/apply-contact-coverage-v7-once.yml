name: Apply contact coverage implementation v7 once

on:
  push:
    branches:
      - feat/info-communications-contact-coverage
    paths:
      - .github/workflows/apply-contact-coverage-v7-once.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: apply-contact-coverage-implementation-v7-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dj-thank/queria-master' && github.ref == 'refs/heads/feat/info-communications-contact-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/info-communications-contact-coverage
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: g-contact-batch
          path: inbound
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "32759320358"
      - name: Apply, recover, test, and commit non-workflow files
        env:
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        shell: bash
        # Re-run after the apply script was reduced to commit only validated non-workflow changes.
        run: bash scripts/apply_contact_coverage_v3_once.sh
