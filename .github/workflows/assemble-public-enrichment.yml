name: Assemble public enrichment hardening

on:
  push:
    branches:
      - hardening/public-enrichment-v1.1
    paths:
      - .github/workflows/assemble-public-enrichment.yml
      - company_scout/public_enrichment/.assembly/ready
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/assemble-public-enrichment.yml
      - company_scout/public_enrichment/.assembly/**

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/public-enrichment-v1.1
          fetch-depth: 0

      - name: Assemble files when all bundle parts are ready
        shell: bash
        run: |
          set -euo pipefail
          ASSEMBLY="company_scout/public_enrichment/.assembly"
          if [[ ! -f "$ASSEMBLY/ready" ]]; then
            echo "Bundle is not marked ready; nothing to assemble."
            exit 0
          fi

          python - <<'PY'
          import base64
          import shutil
          import tarfile
          import tempfile
          from pathlib import Path

          repo = Path.cwd().resolve()
          assembly = repo / "company_scout/public_enrichment/.assembly"
          parts = sorted(assembly.glob("bundle.part-*"))
          if not parts:
              raise RuntimeError("bundle parts are missing")
          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          archive = Path(tempfile.mkdtemp()) / "bundle.tar.xz"
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          extract_root = Path(tempfile.mkdtemp()).resolve()

          with tarfile.open(archive, "r:xz") as tf:
              for member in tf.getmembers():
                  destination = (extract_root / member.name).resolve()
                  if extract_root not in destination.parents and destination != extract_root:
                      raise RuntimeError(f"unsafe archive path: {member.name}")
              tf.extractall(extract_root)

          target = repo / "company_scout/public_enrichment"
          for item in extract_root.iterdir():
              if item.name == ".github":
                  continue
              destination = target / item.name
              if destination.exists() and destination.is_dir():
                  shutil.rmtree(destination)
              elif destination.exists():
                  destination.unlink()
              if item.is_dir():
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)
          PY

          rm -rf company_scout/public_enrichment/.assembly
          rm -f .github/workflows/assemble-public-enrichment.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: harden public company enrichment pipeline"
          git push origin HEAD:hardening/public-enrichment-v1.1
