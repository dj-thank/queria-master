name: JSIC 39 official contact collection

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: Start position within prioritized companies that have an official URL
        required: false
        default: "0"
      batch_size:
        description: Companies per shard
        required: false
        default: "100"
      max_pages:
        description: Maximum same-host pages per company
        required: false
        default: "4"
  pull_request:
    paths:
      - ".github/workflows/jsic39-contact-collection.yml"
      - "company_scout/public_enrichment/jsic39_collection.py"
      - "company_scout/public_enrichment/official_site_phone_enricher.py"
      - "company_scout/public_enrichment/tests/test_jsic39_collection.py"
      - "company_scout/public_enrichment/tests/test_phone_security.py"

permissions:
  contents: read

concurrency:
  group: jsic39-contact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  START_OFFSET: ${{ github.event.inputs.start_offset || '0' }}
  BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
  MAX_PAGES: ${{ github.event.inputs.max_pages || '4' }}

jobs:
  build-public-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require artifact encryption key
        env:
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          (( ${#G_CONTACT_ARTIFACT_KEY} >= 32 )) || {
            echo "G_CONTACT_ARTIFACT_KEY must be configured with at least 32 characters." >&2
            exit 1
          }
      - name: Install Queria Master
        run: python -m pip install -e .
      - name: Build current information-and-communications public database
        run: python -m queria_master refresh --scope info-communications --no-cache
      - name: Export JSIC middle-code 39 companies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p collection
          python -m queria_master --db data/queria_master.duckdb search \
            --industry-middle 39 \
            --limit 100000 \
            --out collection/jsic39_all.csv
          python -m queria_master --db data/queria_master.duckdb search \
            --industry-middle 39 \
            --has-web \
            --limit 100000 \
            --out collection/jsic39_with_web.csv
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          def count(path: str) -> int:
              with Path(path).open(encoding="utf-8-sig", newline="") as handle:
                  return sum(1 for _ in csv.DictReader(handle))

          summary = {
              "jsic_middle_code": "39",
              "companies": count("collection/jsic39_all.csv"),
              "companies_with_public_url": count("collection/jsic39_with_web.csv"),
          }
          Path("collection/export_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Encrypt public-index artifact
        env:
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          (( ${#G_CONTACT_ARTIFACT_KEY} >= 32 ))
          umask 077
          tar -C collection -czf - jsic39_all.csv jsic39_with_web.csv export_summary.json |
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:G_CONTACT_ARTIFACT_KEY \
              -out collection/jsic39-public-index.tar.gz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: jsic39-public-index
          path: collection/jsic39-public-index.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

  crawl-official-sites:
    needs: build-public-index
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install crawler dependencies
        working-directory: company_scout/public_enrichment
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: jsic39-public-index
          path: collection-archive
      - name: Decrypt public-index artifact
        env:
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          (( ${#G_CONTACT_ARTIFACT_KEY} >= 32 ))
          umask 077
          mkdir -p collection
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:G_CONTACT_ARTIFACT_KEY \
            -in collection-archive/jsic39-public-index.tar.gz.enc |
            tar -C collection -xzf -
          test -s collection/jsic39_all.csv
          test -s collection/jsic39_with_web.csv
          test -s collection/export_summary.json
      - name: Prepare prioritized shard and collect phone candidates
        shell: bash
        working-directory: company_scout/public_enrichment
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          [[ "$START_OFFSET" =~ ^[0-9]+$ ]]
          [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]]
          [[ "$MAX_PAGES" =~ ^[0-9]+$ ]]
          (( BATCH_SIZE >= 1 && BATCH_SIZE <= 500 ))
          (( MAX_PAGES >= 1 && MAX_PAGES <= 10 ))
          OFFSET=$((START_OFFSET + SHARD * BATCH_SIZE))
          WORK="work/shard-${SHARD}"
          mkdir -p "$WORK"
          python jsic39_collection.py prepare-shard \
            --companies ../../collection/jsic39_with_web.csv \
            --db "$WORK/targets.sqlite3" \
            --manifest "$WORK/manifest.csv" \
            --summary "$WORK/prepare_summary.json" \
            --offset "$OFFSET" \
            --limit "$BATCH_SIZE"
          python official_site_phone_enricher.py \
            --db "$WORK/targets.sqlite3" \
            --output "$WORK/phones.csv" \
            --progress "$WORK/progress.jsonl" \
            --summary "$WORK/collection_summary.json" \
            --max-pages "$MAX_PAGES" \
            --max-candidates 5 \
            --sleep 0.75 \
            --timeout 20
      - name: Encrypt shard artifact
        working-directory: company_scout/public_enrichment
        env:
          SHARD: ${{ matrix.shard }}
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          (( ${#G_CONTACT_ARTIFACT_KEY} >= 32 ))
          WORK="work/shard-${SHARD}"
          test -s "$WORK/manifest.csv"
          test -e "$WORK/progress.jsonl"
          test -s "$WORK/phones.csv"
          umask 077
          tar -C "$WORK" -czf - \
              manifest.csv progress.jsonl phones.csv prepare_summary.json collection_summary.json |
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:G_CONTACT_ARTIFACT_KEY \
              -out "$WORK/jsic39-phone-${SHARD}.tar.gz.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: jsic39-phone-${{ matrix.shard }}
          path: company_scout/public_enrichment/work/shard-${{ matrix.shard }}/jsic39-phone-${{ matrix.shard }}.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

  merge-batch:
    needs: [build-public-index, crawl-official-sites]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: jsic39-public-index
          path: collection-archive
      - uses: actions/download-artifact@v4
        with:
          pattern: jsic39-phone-*
          path: batches
      - name: Decrypt merge inputs
        working-directory: company_scout/public_enrichment
        env:
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          (( ${#G_CONTACT_ARTIFACT_KEY} >= 32 ))
          umask 077
          mkdir -p ../../collection ../../batches/decrypted
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:G_CONTACT_ARTIFACT_KEY \
            -in ../../collection-archive/jsic39-public-index.tar.gz.enc |
            tar -C ../../collection -xzf -
          test -s ../../collection/jsic39_all.csv
          test -s ../../collection/export_summary.json
          mapfile -t SHARD_ARCHIVES < <(find ../../batches -type f -name 'jsic39-phone-*.tar.gz.enc' | sort)
          (( ${#SHARD_ARCHIVES[@]} == 8 )) || {
            echo "Expected 8 encrypted JSIC39 shard artifacts." >&2
            exit 1
          }
          for archive in "${SHARD_ARCHIVES[@]}"; do
            shard_name="$(basename "$archive" .tar.gz.enc)"
            shard_dir="../../batches/decrypted/$shard_name"
            mkdir -p "$shard_dir"
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:G_CONTACT_ARTIFACT_KEY -in "$archive" |
              tar -C "$shard_dir" -xzf -
          done
      - name: Merge the public index and phone evidence
        shell: bash
        working-directory: company_scout/public_enrichment
        run: |
          set -euo pipefail
          mkdir -p output
          python jsic39_collection.py merge \
            --all-companies ../../collection/jsic39_all.csv \
            --manifest '../../batches/decrypted/**/manifest.csv' \
            --phones '../../batches/decrypted/**/phones.csv' \
            --progress '../../batches/decrypted/**/progress.jsonl' \
            --output output/jsic39_public_contacts.csv \
            --summary output/jsic39_collection_summary.json
          cp ../../collection/export_summary.json output/export_summary.json
      - name: Encrypt merged contact artifact
        working-directory: company_scout/public_enrichment
        env:
          G_CONTACT_ARTIFACT_KEY: ${{ secrets.G_CONTACT_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          (( ${#G_CONTACT_ARTIFACT_KEY} >= 32 ))
          umask 077
          tar -C output -czf - jsic39_public_contacts.csv jsic39_collection_summary.json export_summary.json |
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:G_CONTACT_ARTIFACT_KEY \
              -out output/jsic39-contact-batch.tar.gz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: jsic39-contact-batch
          path: company_scout/public_enrichment/output/jsic39-contact-batch.tar.gz.enc
          if-no-files-found: error
          retention-days: 30
