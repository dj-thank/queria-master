name: Apply public enrichment desktop integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "company_scout/**"
      - ".github/workflows/apply-public-enrichment-ui.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.head_ref == 'feat/public-enrichment-desktop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: windows-latest
    defaults:
      run:
        working-directory: company_scout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Rust stable with rustfmt
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: company_scout/src-tauri -> target

      - name: Assemble and apply verified integration patch
        shell: pwsh
        run: |
          if (-not (Test-Path .integration/ready)) {
            Write-Host "Patch already applied."
            exit 0
          }
          @'
          import base64
          import hashlib
          import shutil
          import tarfile
          import tempfile
          from pathlib import Path

          root = Path.cwd().resolve()
          assembly = root / ".integration"
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in sorted(assembly.glob("bundle.part-*")))
          archive = Path(tempfile.mkdtemp()) / "integration.tar.xz"
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = "13c86ddcf1988a059d1a6539e9f92d11cc1014afe76f808ac5623496ebe1fa47"
          if digest != expected:
              raise RuntimeError(f"integration archive checksum mismatch: {digest}")
          extracted = Path(tempfile.mkdtemp()).resolve()
          with tarfile.open(archive, "r:xz") as bundle:
              for member in bundle.getmembers():
                  destination = (extracted / member.name).resolve()
                  if extracted not in destination.parents and destination != extracted:
                      raise RuntimeError(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise RuntimeError(f"archive links are not allowed: {member.name}")
                  if not (member.isdir() or member.isfile()):
                      raise RuntimeError(f"unsupported archive entry: {member.name}")
              bundle.extractall(extracted, filter="data")
          for item in extracted.iterdir():
              destination = root / item.name
              if item.is_dir():
                  shutil.copytree(item, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, destination)
          '@ | python -
          @'
          from pathlib import Path

          path = Path("scripts/apply_public_enrichment_ui.py")
          text = path.read_text(encoding="utf-8")
          old = 'replace_once(enricher, \'    sheet_name: str = "企業DB",\', \'    sheet_name: str = "",\')\nreplace_once(enricher, \'    sheet_name: str = "企業DB",\', \'    sheet_name: str = "",\')'
          new = 'sheet_text = enricher.read_text(encoding="utf-8")\nsheet_needle = \'    sheet_name: str = "企業DB",\'\nif sheet_text.count(sheet_needle) != 2:\n    raise RuntimeError(f"expected exactly two default sheet declarations: found {sheet_text.count(sheet_needle)}")\nenricher.write_text(sheet_text.replace(sheet_needle, \'    sheet_name: str = "",\'), encoding="utf-8")'
          if text.count(old) != 1:
              raise RuntimeError(f"unexpected patch-script sheet block count: {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          '@ | python -
          python scripts/apply_public_enrichment_ui.py
          Remove-Item scripts/apply_public_enrichment_ui.py
          Remove-Item .integration -Recurse -Force
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r public_enrichment/requirements.txt

      - name: Python tests
        shell: pwsh
        run: python -m unittest discover -s public_enrichment/tests -v

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Frontend typecheck and build
        shell: pwsh
        run: npm run build

      - name: Rust tests
        shell: pwsh
        run: |
          $resource = Join-Path $PWD "src-tauri/resources/bin/codex.exe"
          $created = -not (Test-Path $resource)
          if ($created) {
            New-Item -ItemType Directory -Path (Split-Path $resource) -Force | Out-Null
            [System.IO.File]::WriteAllBytes($resource, [byte[]]@())
          }
          try {
            cargo test --manifest-path src-tauri/Cargo.toml --lib
            if ($LASTEXITCODE -ne 0) { throw "Rust tests failed with exit code $LASTEXITCODE" }
          } finally {
            if ($created -and (Test-Path $resource)) { Remove-Item $resource -Force }
          }

      - name: Source-neutrality scan
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem public_enrichment -Recurse -File
            Get-Item src-tauri/src/public_enrichment.rs
            Get-Item src/App.tsx
            Get-Item src/api.ts
            Get-Item src/types.ts
          )
          $patterns = @("FUMA", "fumadata", "FUMA_ID", "_next/data", "buildId", "56353", "56,353", "EB4E60")
          $matches = $targets | Select-String -Pattern $patterns -SimpleMatch -ErrorAction SilentlyContinue
          if ($matches) {
            $matches | Format-Table -AutoSize
            throw "Source-specific marker detected."
          }

      - name: Commit generated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $workflow = Join-Path $PWD "../.github/workflows/apply-public-enrichment-ui.yml"
          if (Test-Path $workflow) {
            Remove-Item $workflow -Force
          }

          $repoRoot = (Resolve-Path (Join-Path $PWD "..")).Path
          $allowedPaths = @(
            ".github/workflows/apply-public-enrichment-ui.yml"
            "company_scout/.integration/bundle.part-00"
            "company_scout/.integration/bundle.part-01"
            "company_scout/.integration/ready"
            "company_scout/package-lock.json"
            "company_scout/public_enrichment/README.md"
            "company_scout/public_enrichment/prepare_windows.cmd"
            "company_scout/public_enrichment/public_data_enricher.py"
            "company_scout/public_enrichment/tests/test_public_data_enricher.py"
            "company_scout/src/App.tsx"
            "company_scout/src/api.ts"
            "company_scout/src/styles.css"
            "company_scout/src/types.ts"
            "company_scout/src-tauri/Cargo.lock"
            "company_scout/src-tauri/src/lib.rs"
            "company_scout/src-tauri/src/public_enrichment.rs"
            "company_scout/src-tauri/tauri.conf.json"
          )
          $requiredPaths = @(
            ".github/workflows/apply-public-enrichment-ui.yml"
            "company_scout/.integration/bundle.part-00"
            "company_scout/.integration/bundle.part-01"
            "company_scout/.integration/ready"
            "company_scout/package-lock.json"
            "company_scout/src-tauri/Cargo.lock"
            "company_scout/src-tauri/src/public_enrichment.rs"
          )
          $changedPaths = @(
            git -C $repoRoot diff --name-only
            git -C $repoRoot ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique
          $unexpected = @($changedPaths | Where-Object { $_ -notin $allowedPaths })
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Error "Unexpected generated path: $_" }
            throw "Refusing to commit paths outside the integration allowlist."
          }
          $missing = @($requiredPaths | Where-Object { $_ -notin $changedPaths })
          if ($missing) {
            $missing | ForEach-Object { Write-Error "Missing required generated path: $_" }
            throw "The one-shot integration did not produce its required path set."
          }

          git -C $repoRoot add -- $changedPaths
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage the verified integration path set." }
          git -C $repoRoot diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "The staged integration diff failed git diff --check." }

          $addedLines = git -C $repoRoot diff --cached --unified=0 |
            Where-Object { $_ -match '^\+(?!\+\+)' }
          $secretPatterns = @(
            "-----BEGIN PRIVATE KEY-----"
            "-----BEGIN RSA PRIVATE KEY-----"
            "-----BEGIN OPENSSH PRIVATE KEY-----"
            "github_pat_"
            "ghp_"
            "sk-proj-"
          )
          $secretMatches = $addedLines | Select-String -Pattern $secretPatterns -SimpleMatch
          if ($secretMatches) {
            $secretMatches | ForEach-Object { Write-Error $_.Line }
            throw "Potential secret material detected in added lines."
          }

          $remaining = @(
            git -C $repoRoot diff --name-only
            git -C $repoRoot ls-files --others --exclude-standard
          ) | Where-Object { $_ }
          if ($remaining) {
            $remaining | ForEach-Object { Write-Error "Unstaged path remains: $_" }
            throw "Refusing to commit with unstaged or untracked changes."
          }
          git -C $repoRoot diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git -C $repoRoot commit -m "feat: connect public enrichment to desktop app"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the generated integration commit." }
          git -C $repoRoot push origin HEAD:feat/public-enrichment-desktop
          if ($LASTEXITCODE -ne 0) { throw "Failed to push the generated integration commit." }
