name: Configure information-communications edition once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/configure-information-edition-once.yml

permissions:
  contents: write

concurrency:
  group: configure-information-edition-once
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'dj-thank/queria-master' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop
          fetch-depth: 1

      - name: Make develop the information-communications edition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              with Path(path).open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write(text)

          def replace_exact(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              write(path, text.replace(old, new, 1))

          replace_exact(
              "bootstrap.ps1",
              '[string]$Scope = "all-public"',
              '[string]$Scope = "info-communications"',
          )
          replace_exact(
              "bootstrap.ps1",
              'if ((Test-Path "data\\queria_master.duckdb") -and (Test-Path "cache\\all-public-latest")) {\n    Write-Host "[3/5] Using the bundled full dataset (no re-download)"\n} else {',
              '$ScopeCache = Join-Path "cache" ("{0}-latest" -f $Scope)\nif ((Test-Path "data\\queria_master.duckdb") -and (Test-Path $ScopeCache)) {\n    Write-Host "[3/5] Using the bundled $Scope dataset (no re-download)"\n} else {',
          )
          replace_exact(
              "bootstrap.sh",
              'SCOPE="${1:-all-public}"',
              'SCOPE="${1:-info-communications}"',
          )
          replace_exact(
              "bootstrap.sh",
              'if [[ -f data/queria_master.duckdb && -d cache/all-public-latest ]]; then\n  echo "[3/5] 同梱済みの全量データを使用します（再ダウンロードしません）"',
              'if [[ -f data/queria_master.duckdb && -d "cache/${SCOPE}-latest" ]]; then\n  echo "[3/5] 同梱済みの ${SCOPE} データを使用します（再ダウンロードしません）"',
          )
          replace_exact(
              "refresh.ps1",
              '[string]$Scope = "all-public"',
              '[string]$Scope = "info-communications"',
          )
          replace_exact(
              "refresh.sh",
              'SCOPE="${1:-all-public}"',
              'SCOPE="${1:-info-communications}"',
          )

          readme_path = "README.md"
          readme = read(readme_path)
          title = "# Queria Master — 全法人・Queria公開データを DuckDB へ\n"
          banner = (
              "\n> **ブランチ区分：情報通信業版（`develop`）**\n"
              ">\n"
              "> このブランチは日本標準産業分類の大分類G（情報通信業、中分類37〜41）を既定対象とします。"
              "全量版は `main` ブランチです。引数を省略したセットアップと更新は "
              "`info-communications` を使用します。\n\n"
          )
          if banner not in readme:
              if not readme.startswith(title):
                  raise SystemExit("README.md: canonical title was not found")
              write(readme_path, title + banner + readme[len(title):])

          workflow = Path(".github/workflows/configure-information-edition-once.yml")
          if not workflow.is_file():
              raise SystemExit(f"missing one-shot workflow: {workflow}")
          workflow.unlink()
          PY

          bash -n bootstrap.sh refresh.sh
          grep -F '[string]$Scope = "info-communications"' bootstrap.ps1
          grep -F 'SCOPE="${1:-info-communications}"' bootstrap.sh refresh.sh
          python scripts/generate_manifest.py
          python scripts/generate_manifest.py --check
          python scripts/verify_package.py
          git diff --check

      - name: Commit the edition split
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes required"; exit 0; }
          git commit -m "chore: make develop the information-communications edition"
          git push origin HEAD:develop
