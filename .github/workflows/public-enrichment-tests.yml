name: Public enrichment tests

on:
  push:
    paths:
      - "company_scout/public_enrichment/**"
      - ".github/workflows/public-enrichment-tests.yml"
  pull_request:
    paths:
      - "company_scout/public_enrichment/**"
      - ".github/workflows/public-enrichment-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: company_scout/public_enrichment
        run: python -m pip install -r requirements.txt
      - name: Compile
        working-directory: company_scout/public_enrichment
        run: >-
          python -m py_compile
          public_data_enricher.py
          edinet_salary_enricher.py
          official_site_phone_enricher.py
          import_verified_contacts.py
          jsic39_collection.py
          corporate_index_matcher.py
      - name: Unit tests
        working-directory: company_scout/public_enrichment
        run: python -m unittest discover -s tests -v
